name: Build termEscape (IPA + APK)

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show environment diagnostics
        shell: bash
        run: |
          set -euxo pipefail
          echo "=== Android diagnostics ==="
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Commit: $GITHUB_SHA"
          uname -a
          df -h
          node --version || true
          npm --version || true
          java -version || true
          echo "Root files:"
          ls -la
          echo "package.json:"
          if [[ -f package.json ]]; then cat package.json; else echo "::error::package.json is missing"; exit 1; fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        id: deps
        shell: bash
        run: |
          set -euxo pipefail
          if [[ -f package-lock.json ]]; then
            npm ci
          elif [[ -f pnpm-lock.yaml ]]; then
            corepack enable
            pnpm install --frozen-lockfile
          elif [[ -f yarn.lock ]]; then
            corepack enable
            yarn install --immutable || yarn install --frozen-lockfile
          else
            echo "::warning::No lockfile found; using npm install."
            npm install
          fi
        continue-on-error: true

      - name: Report dependency installation failure
        if: steps.deps.outcome != 'success'
        run: |
          echo "::error::Dependency installation failed. Review the npm/pnpm/yarn output above."
          exit 1

      - name: Install Capacitor
        id: capdeps
        run: npm install @capacitor/core @capacitor/cli @capacitor/android
        continue-on-error: true

      - name: Report Capacitor installation failure
        if: steps.capdeps.outcome != 'success'
        run: |
          echo "::error::Capacitor installation failed."
          exit 1

      - name: Build web app and check output
        id: webbuild
        shell: bash
        run: |
          set -euxo pipefail
          npm run build
          WEB_DIR="${MOBILE_WEB_DIR:-dist}"
          echo "Checking output directory: $WEB_DIR"
          if [[ ! -f "$WEB_DIR/index.html" ]]; then
            echo "::error::Missing $WEB_DIR/index.html. Check the build script or update WEB_DIR in this workflow."
            find . -maxdepth 3 -type d -print
            exit 1
          fi
          echo "Web output files:"
          find "$WEB_DIR" -maxdepth 3 -type f -print
        continue-on-error: true

      - name: Report web build failure
        if: steps.webbuild.outcome != 'success'
        run: |
          echo "::error::Web build failed; Android packaging is stopped."
          exit 1

      - name: Create and sync Android project
        id: capconfig
        shell: bash
        run: |
          set -euxo pipefail
          WEB_DIR="${MOBILE_WEB_DIR:-dist}"
          cat > capacitor.config.json <<EOF
          {
            "appId": "fr.tatiana.termescape",
            "appName": "termEscape",
            "webDir": "$WEB_DIR",
            "bundledWebRuntime": false
          }
          EOF
          cat capacitor.config.json
          if [[ ! -d android ]]; then npx cap add android; fi
          npx cap sync android
          find android -maxdepth 3 -type f -print | sort | head -200
        continue-on-error: true

      - name: Report Android setup failure
        if: steps.capconfig.outcome != 'success'
        run: |
          echo "::error::Capacitor could not create or sync the Android project."
          exit 1

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build debug APK
        id: apkbuild
        shell: bash
        run: |
          set -euxo pipefail
          cd android
          chmod +x gradlew
          ./gradlew --version
          ./gradlew --no-daemon --stacktrace --info assembleDebug
          echo "APK output files:"
          find app/build/outputs/apk -type f -name '*.apk' -print
          test -f app/build/outputs/apk/debug/app-debug.apk
        continue-on-error: true

      - name: Upload APK
        if: steps.apkbuild.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: termEscape-android-apk
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Print Android failure diagnostics
        if: always() && steps.apkbuild.outcome != 'success'
        shell: bash
        run: |
          echo "::error::APK build failed. Read the Gradle error and stack trace above."
          find android -maxdepth 7 -type d \( -name build -o -name reports -o -name outputs \) -print 2>/dev/null || true
          exit 1

  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show environment diagnostics
        shell: bash
        run: |
          set -euxo pipefail
          echo "=== iOS diagnostics ==="
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Commit: $GITHUB_SHA"
          sw_vers
          uname -a
          df -h
          xcodebuild -version
          xcodebuild -showsdks
          echo "Root files:"
          ls -la
          if [[ ! -f package.json ]]; then echo "::error::package.json is missing"; exit 1; fi
          cat package.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        id: deps
        shell: bash
        run: |
          set -euxo pipefail
          if [[ -f package-lock.json ]]; then
            npm ci
          elif [[ -f pnpm-lock.yaml ]]; then
            corepack enable
            pnpm install --frozen-lockfile
          elif [[ -f yarn.lock ]]; then
            corepack enable
            yarn install --immutable || yarn install --frozen-lockfile
          else
            echo "::warning::No lockfile found; using npm install."
            npm install
          fi
        continue-on-error: true

      - name: Report dependency installation failure
        if: steps.deps.outcome != 'success'
        run: |
          echo "::error::Dependency installation failed. Review the package manager output above."
          exit 1

      - name: Install Capacitor
        id: capdeps
        run: npm install @capacitor/core @capacitor/cli @capacitor/ios
        continue-on-error: true

      - name: Report Capacitor installation failure
        if: steps.capdeps.outcome != 'success'
        run: |
          echo "::error::Capacitor installation failed."
          exit 1

      - name: Build web app and check output
        id: webbuild
        shell: bash
        run: |
          set -euxo pipefail
          npm run build
          WEB_DIR="${MOBILE_WEB_DIR:-dist}"
          if [[ ! -f "$WEB_DIR/index.html" ]]; then
            echo "::error::Missing $WEB_DIR/index.html. Check the build script or update WEB_DIR in this workflow."
            find . -maxdepth 3 -type d -print
            exit 1
          fi
          echo "Web output files:"
          find "$WEB_DIR" -maxdepth 3 -type f -print
        continue-on-error: true

      - name: Report web build failure
        if: steps.webbuild.outcome != 'success'
        run: |
          echo "::error::Web build failed; iOS packaging is stopped."
          exit 1

      - name: Create and sync iOS project
        id: capconfig
        shell: bash
        run: |
          set -euxo pipefail
          WEB_DIR="${MOBILE_WEB_DIR:-dist}"
          cat > capacitor.config.json <<EOF
          {
            "appId": "fr.tatiana.termescape",
            "appName": "termEscape",
            "webDir": "$WEB_DIR",
            "bundledWebRuntime": false
          }
          EOF
          cat capacitor.config.json
          if [[ ! -d ios ]]; then npx cap add ios; fi
          npx cap sync ios
          find ios -maxdepth 4 -type f -print | sort | head -250
        continue-on-error: true

      - name: Report iOS setup failure
        if: steps.capconfig.outcome != 'success'
        run: |
          echo "::error::Capacitor could not create or sync the iOS project."
          exit 1

      - name: Build unsigned iOS app
        id: iosbuild
        shell: bash
        run: |
          set -euxo pipefail
          xcodebuild -list -project ios/App/App.xcodeproj
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$PWD/build/ios" \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_IDENTITY="" \
            -verbose build
          APP_PATH="$PWD/build/ios/Build/Products/Release-iphoneos/App.app"
          test -d "$APP_PATH"
          echo "Built app files:"
          find "$APP_PATH" -maxdepth 3 -print | head -250
        continue-on-error: true

      - name: Package unsigned IPA
        id: ipapackage
        if: steps.iosbuild.outcome == 'success'
        shell: bash
        run: |
          set -euxo pipefail
          APP_PATH="$PWD/build/ios/Build/Products/Release-iphoneos/App.app"
          mkdir -p ipa/Payload
          ditto "$APP_PATH" ipa/Payload/App.app
          (cd ipa && /usr/bin/zip -r ../termEscape-unsigned.ipa Payload)
          ls -lh termEscape-unsigned.ipa
          unzip -t termEscape-unsigned.ipa
          unzip -l termEscape-unsigned.ipa | head -200
          test -s termEscape-unsigned.ipa
        continue-on-error: true

      - name: Upload IPA
        if: steps.ipapackage.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: termEscape-ios-ipa-unsigned
          path: termEscape-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Print iOS failure diagnostics
        if: always() && (steps.iosbuild.outcome != 'success' || steps.ipapackage.outcome != 'success')
        shell: bash
        run: |
          echo "::error::IPA build or packaging failed. Inspect the first Xcode error above."
          echo "An unsigned IPA requires Apple signing/provisioning for normal installation on an iPhone."
          find build/ios -maxdepth 6 -print 2>/dev/null | head -400 || true
          find ios -maxdepth 7 -type d \( -name '*.xcresult' -o -name Reports -o -name Logs \) -print 2>/dev/null || true
          exit 1

  summary:
    name: Final build summary
    runs-on: ubuntu-latest
    if: always()
    needs:
      - build-android
      - build-ios
    steps:
      - name: Print platform results
        shell: bash
        run: |
          echo "================ termEscape build summary ================"
          echo "Android job: ${{ needs.build-android.result }}"
          echo "iOS job: ${{ needs.build-ios.result }}"
          echo "Android success publishes: termEscape-android-apk"
          echo "iOS success publishes: termEscape-ios-ipa-unsigned"
          echo "Both succeed = both artifacts; one succeeds = that artifact remains available."
          if [[ "${{ needs.build-android.result }}" == "success" || "${{ needs.build-ios.result }}" == "success" ]]; then
            echo "At least one platform succeeded. Download the artifact(s) from this workflow run."
          else
            echo "::error::Both platform builds failed. Open both jobs and inspect the first error in each log."
            exit 1
          fi
